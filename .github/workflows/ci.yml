name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        key-store: ["json", "sqlite"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names only)
        run: flake8 api tests ai_decision_engine.py ai_memory_system.py autonomy_tracker.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test
        env:
          KEY_STORE: ${{ matrix.key-store }}
        run: pytest
